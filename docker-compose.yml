services:
  redis:
    image: redis:7-alpine
    container_name: m3u8-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - m3u8-redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  m3u8-downloader:
    build: .
    container_name: m3u8-downloader
    ports:
      - "38478:38478"
    environment:
      DATABASE_URL: file:/app/data/prod.db
      DOWNLOADS_DIR: /app/downloads
      COOKIES_DIR: /app/data/cookies
      PORT: "38478"
      HOSTNAME: "0.0.0.0"
      DOWNLOADER: ffmpeg
      DOWNLOADM3U8_BIN: /usr/local/bin/downloadm3u8
      PYTHON_BIN: python3
      PYTHON_SCRIPTS_DIR: /app/python
      MAX_CONCURRENT_DOWNLOADS: "2"
      DOWNLOAD_TIMEOUT_MS: "1800000"
      NODE_ENV: production
      REDIS_URL: redis://redis:6379/0
      QUEUE_BACKEND: celery
      ALL_VIDEO_ENABLED: "1"
      ALL_VIDEO_MAX_CONCURRENT: "3"
      ALL_VIDEO_MAX_PER_HOUR: "30"
      ALL_VIDEO_MAX_FILE_BYTES: "8589934592"
      ALL_VIDEO_TIMEOUT_S: "1800"
      # Optional AI router (OpenAI-compatible). Leave empty for rules-only.
      CLASSIFY_AI_URL: "${CLASSIFY_AI_URL:-}"
      CLASSIFY_AI_KEY: "${CLASSIFY_AI_KEY:-}"
      CLASSIFY_AI_MODEL: "${CLASSIFY_AI_MODEL:-gpt-4o-mini}"
    depends_on:
      redis:
        condition: service_healthy
    labels:
      com.m3u8.fingerprint: "${M3U8_BUILD_FINGERPRINT:-unknown}"
    volumes:
      - m3u8-data:/app/data
      - m3u8-downloads:/app/downloads
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:38478/api/downloads').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  worker:
    build: .
    container_name: m3u8-worker
    entrypoint: ["/bin/sh", "/app/python/worker-entrypoint.sh"]
    environment:
      DATABASE_URL: file:/app/data/prod.db
      DOWNLOADS_DIR: /app/downloads
      COOKIES_DIR: /app/data/cookies
      DOWNLOADER: ffmpeg
      DOWNLOADM3U8_BIN: /usr/local/bin/downloadm3u8
      PYTHON_BIN: python3
      PYTHON_SCRIPTS_DIR: /app/python
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      APP_ROOT: /app
      REDIS_URL: redis://redis:6379/0
      WORKER_CONCURRENCY: "3"
      WORKER_MAX_TASKS_PER_CHILD: "25"
      TASK_SOFT_TIME_LIMIT: "1800"
      TASK_TIME_LIMIT: "1900"
      CELERY_QUEUES: downloads,extracts
      CELERY_LOGLEVEL: INFO
      DOWNLOAD_TIMEOUT_MS: "1800000"
      ALL_VIDEO_MAX_FILE_BYTES: "8589934592"
      ALL_VIDEO_TIMEOUT_S: "1800"
      NODE_ENV: production
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - m3u8-data:/app/data
      - m3u8-downloads:/app/downloads
    restart: unless-stopped

volumes:
  m3u8-data:
  m3u8-downloads:
  m3u8-redis:
